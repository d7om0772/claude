<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Black Screen Fix</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root {
    --bg: #F1F6FE; --white: #F8FAFD; --floor: #E2EBFA; --text: #14284B; --navy: #1D2C48;
    --problem: #FF3347; --fix: #22D36A; --brand: #2F6BCF; --screen: #6B9FE9; --inside: #223152;
    --badge-problem: #e5384a; --badge-fix: #1fae5b; --muted: #5C6E91;
  }
  html, body { margin: 0; padding: 0; background: #F1F6FE; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(ellipse 85% 50% at 50% 52%, #ffffff, #f1f6fe 55%, #e0eafa);
    font-family: 'Baloo Bhaijaan 2', sans-serif; color: var(--text); }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #curtain { position: absolute; left: 0; top: 0; width: 1080px; height: 800px; pointer-events: none;
    background: linear-gradient(180deg, rgba(241,246,254,.97) 0, rgba(241,246,254,.92) 560px, rgba(241,246,254,0) 800px); opacity: 0; }
  #labels { position: absolute; inset: 0; pointer-events: none; }

  /* header */
  #header { position: absolute; left: 150px; top: 186px; width: 780px; height: 84px; border-radius: 42px;
    background: rgba(255,255,255,.96); box-shadow: 0 10px 30px rgba(31,58,110,.10), 0 2px 6px rgba(31,58,110,.06);
    display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 30px; box-sizing: border-box; }
  #header .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 38px; color: var(--text); }
  #header .brand img { width: 50px; height: 50px; object-fit: contain; }
  #dots { display: flex; gap: 12px; direction: ltr; }
  .dot { width: 38px; height: 38px; border-radius: 50%; box-sizing: border-box; border: 2.5px solid #c9d4e6;
    display: flex; align-items: center; justify-content: center; font: 600 19px 'Inter', sans-serif; color: #5d6d8c; background: #fff; }
  .dot.problem { background: var(--badge-problem); border-color: var(--badge-problem); color: #fff; }
  .dot.fix { background: var(--badge-fix); border-color: var(--badge-fix); color: #fff; }

  /* title zone */
  #titleZone { position: absolute; left: 120px; top: 318px; width: 840px; height: 330px; text-align: center; }
  #badge { display: inline-flex; align-items: center; gap: 10px; height: 66px; padding: 0 34px; border-radius: 33px;
    font-weight: 800; font-size: 36px; color: #fff; background: var(--badge-problem);
    box-shadow: 0 8px 22px rgba(229,56,74,.28); margin-top: 6px; }
  #badge.fix { background: var(--badge-fix); box-shadow: 0 8px 22px rgba(31,174,91,.28); }
  #badge .num { font-family: 'Baloo Bhaijaan 2'; }
  #title { font-weight: 800; font-size: 100px; line-height: 1.15; letter-spacing: -0.5px; color: var(--text); margin-top: 6px; }
  #title.hook { font-size: 100px; line-height: 1.22; margin-top: 4px; }
  #title .red { color: var(--badge-problem); }
  #desc { font-weight: 700; font-size: 40px; color: var(--muted); margin-top: 10px; }
  #chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 16px; margin-top: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 10px; height: 64px; padding: 0 26px; border-radius: 32px;
    background: #fff; font-weight: 800; font-size: 34px; color: var(--text);
    box-shadow: 0 8px 22px rgba(31,58,110,.12); white-space: nowrap; }
  .chip .ic { width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font: 800 24px 'Inter', sans-serif; }
  .chip .ic.fix { background: var(--badge-fix); }
  .chip .ic.problem { background: var(--badge-problem); }
  .chip.warn { background: #fff1f2; color: #b4202f; }

  /* 3D-anchored labels */
  .lbl { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; display: inline-flex; align-items: center; gap: 10px;
    height: 62px; padding: 0 24px; border-radius: 31px; background: #fff; font-weight: 800; font-size: 32px; color: var(--text);
    box-shadow: 0 10px 26px rgba(20,40,75,.18); white-space: nowrap; }
  .lbl .ic { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font: 800 22px 'Inter', sans-serif; }
  .lbl .ic.fix { background: var(--badge-fix); } .lbl .ic.problem { background: var(--badge-problem); }
  .lbl.problem { color: #c21f30; } .lbl.fix { color: #12804a; }
  .lbl.dark { background: var(--navy); color: #fff; }
  .lbl.big { height: 80px; font-size: 44px; border-radius: 40px; padding: 0 30px; }
  .burst { position: absolute; left: 0; top: 0; font-weight: 800; font-size: 64px; color: var(--badge-fix);
    text-shadow: 0 6px 18px rgba(31,174,91,.25); }
  .ring { position: absolute; left: 0; top: 0; border-radius: 50%; box-sizing: border-box; }
  .frame { position: absolute; left: 0; top: 0; border-radius: 22px; box-sizing: border-box; border: 6px solid #FF9F1C;
    box-shadow: 0 0 0 6px rgba(255,159,28,.18); }
  .noTool { position: absolute; left: 0; top: 0; width: 150px; height: 150px; }

  /* captions */
  #caption { position: absolute; left: 120px; top: 1378px; width: 840px; height: 122px; display: flex; align-items: center; justify-content: center; }
  #capPill { display: inline-flex; align-items: center; justify-content: center; gap: 0 16px; max-width: 840px; min-height: 92px; box-sizing: border-box;
    padding: 6px 42px 10px; border-radius: 46px; background: rgba(255,255,255,.97);
    box-shadow: 0 12px 30px rgba(31,58,110,.13), 0 2px 6px rgba(31,58,110,.06); white-space: nowrap;
    font-weight: 800; font-size: 54px; line-height: 1.25; word-spacing: 6px; }
  #capPill span { color: #b6c4dd; }
  #capPill span.past { color: var(--text); }
  #capPill span.cur { color: var(--brand); }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="curtain"></div>
  <div id="labels"></div>
  <div id="header">
    <div class="brand"><img src="../assets/logo_icon.png" alt=""><span>المشاكل وحلولها</span></div>
    <div id="dots"><div class="dot">1</div><div class="dot">2</div><div class="dot">3</div><div class="dot">4</div></div>
  </div>
  <div id="titleZone"><div id="badgeWrap"><div id="badge"></div></div><div id="title"></div><div id="desc"></div><div id="chips"></div></div>
  <div id="caption"><div id="capPill"></div></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
